version: 2

models:
  - name: mart_customer_cohort_retention
    description: >
      Monthly customer cohort analysis measuring repeat purchasing,
      retention, and cumulative revenue.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort_month
              - activity_month

    columns:
      - name: cohort_month
        data_tests:
          - not_null

      - name: activity_month
        data_tests:
          - not_null

      - name: months_since_first_purchase
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: cohort_size
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: active_customers
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: retention_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: monthly_revenue
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mart_product_performance
    description: >
      Product-level revenue, estimated gross profit, customer demand,
      return, and cancellation performance.

    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

      - name: product_name
        data_tests:
          - not_null

      - name: ordered_units
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: completed_revenue
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: product_return_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: product_cancellation_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: revenue_rank
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: mart_geographic_performance
    description: >
      Geographic analysis of customer acquisition, revenue, conversion,
      retention, returns, and recommended market actions.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country
              - state

    columns:
      - name: country
        data_tests:
          - not_null

      - name: state
        data_tests:
          - not_null

      - name: acquired_customer_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: total_revenue
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: customer_conversion_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: repeat_purchaser_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: revenue_share
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: recommended_action
        data_tests:
          - not_null