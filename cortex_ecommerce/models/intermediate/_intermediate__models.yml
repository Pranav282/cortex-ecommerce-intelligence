version: 2

models:
  - name: int_customer_orders
    description: >
      Order-level dataset combining order lifecycle information with
      aggregated item and revenue metrics.

    columns:
      - name: order_id
        description: Unique identifier for an order.
        data_tests:
          - unique
          - not_null

      - name: user_id
        description: Customer associated with the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_thelook__users')
                field: user_id

      - name: order_status
        description: Current status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                - COMPLETE
                - SHIPPED
                - CANCELLED
                - PROCESSING
                - RETURNED

      - name: order_created_at
        description: Timestamp when the order was created.
        data_tests:
          - not_null

      - name: item_count
        description: Number of items associated with the order.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: order_revenue
        description: Total item-level sales value for the order.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: days_to_delivery
        description: Number of days between order creation and delivery.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
